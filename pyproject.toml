[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-fl"
version = "0.1.0"
description = "CHRONOS-FL: Cyber Forensic Flight Recorder and Evidence Trust Platform"
readme = "README.md"
authors = [
    { name = "CHRONOS-FL Core Team", email = "research@chronos-fl.io" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "psutil>=5.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black",
    "flake8",
    "mypy",
]

[project.scripts]
chronos-fl = "chronos.cli.main:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["chronos*"]
