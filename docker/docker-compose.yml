version: '3.8'

services:
  chronos-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: chronos_backend
    ports:
      - "8050:8050"
    environment:
      - DATABASE_URL=postgresql://chronos:chronos_secret@postgres:5432/chronos_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=chronos_secret
    depends_on:
      - postgres
      - redis
      - minio
      - neo4j

  postgres:
    image: postgres:15-alpine
    container_name: chronos_postgres
    environment:
      - POSTGRES_USER=chronos
      - POSTGRES_PASSWORD=chronos_secret
      - POSTGRES_DB=chronos_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: chronos_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: chronos_minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"

  neo4j:
    image: neo4j:5.12-community
    container_name: chronos_neo4j
    environment:
      - NEO4J_AUTH=neo4j/chronos_secret
    ports:
      - "7474:7474"
      - "7687:7687"
